<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Project Genesis — 3D World</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" aria-label="Project Genesis interactive 3D world">
    <canvas id="genesis-canvas"></canvas>
    <div class="hud">
      <div class="panel">
        <div class="title">PROJECT GENESIS</div>
        <div id="status">Connecting to Genesis…</div>
        <div class="metrics" id="metrics"></div>
      </div>
      <div class="hint">Drag to orbit · pinch to zoom · tap terrain to inspect</div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
