services:
  - type: web
    name: project-genesis
    runtime: docker
    repo: https://github.com/project-genesis-ai/Project-Genesis
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-genesis-db
          property: connectionString

databases:
  - name: project-genesis-db
    databaseName: genesis
    plan: basic-256mb
    postgresMajorVersion: "18"
