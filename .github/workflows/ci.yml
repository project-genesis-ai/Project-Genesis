name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A feature-branch update must produce one CI run, not one push run plus one
# pull-request run. Only main pushes run directly; PR updates use synchronize.
# If several updates arrive together, cancel stale work rather than burning
# runner minutes on commits that are no longer current.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Import and simulation smoke test
        run: python -c "from genesis.core.simulation import Simulation; Simulation().step()"
      - name: Check deterministic audit checkpoint
        run: python -c "from genesis.agents.agent import Agent; from genesis.core.checkpoint import build_checkpoint; from genesis.core.config import SimulationConfig; from genesis.core.simulation import Simulation; a=Simulation(config=SimulationConfig(seed=7)); b=Simulation(config=SimulationConfig(seed=7)); a.add_agent(Agent('a','A')); b.add_agent(Agent('a','A')); a.step(); b.step(); assert build_checkpoint(a).digest == build_checkpoint(b).digest; assert a.validate().ok"
      - name: Run tests
        run: python -m pytest
