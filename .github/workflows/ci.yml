name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Import and simulation smoke test
        run: python -c "from genesis.core.simulation import Simulation; Simulation().step()"
      - name: Check deterministic audit checkpoint
        run: |
          python - <<'PY'
          from genesis.agents.agent import Agent
          from genesis.core.checkpoint import build_checkpoint
          from genesis.core.config import SimulationConfig
          from genesis.core.simulation import Simulation

          a = Simulation(config=SimulationConfig(seed=7))
          b = Simulation(config=SimulationConfig(seed=7))
          a.add_agent(Agent('a', 'A'))
          b.add_agent(Agent('a', 'A'))
          a.step()
          b.step()
          first = build_checkpoint(a)
          second = build_checkpoint(b)
          if first.digest != second.digest:
              print('checkpoint top-level differences:')
              for key in sorted(set(first.payload) | set(second.payload)):
                  if first.payload.get(key) != second.payload.get(key):
                      print(f'  - {key}')
          assert first.digest == second.digest
          assert a.validate().ok
          PY
      - name: Run tests
        run: python -m pytest
