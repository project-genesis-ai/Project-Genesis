name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'start.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Final CI — backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Architecture/compile gate
        run: python -m compileall -q src

      - name: Builder/integrator gate
        run: python -c "from genesis.core.simulation import Simulation; s=Simulation(); s.step(); assert s.validate().ok"

      - name: Full QA test suite
        run: python -m pytest

      - name: Phase 8-13 integrated gate
        run: python -c "from genesis.core.genesis_runtime import GenesisRuntime; from genesis.core.hardening import audit_state; from genesis.core.simulation import Simulation; from genesis.orchestration.engineering_loop import EngineeringLoop, EngineeringStage, StageResult; r=GenesisRuntime(Simulation()); r.step(); v=r.verify(); h=audit_state(r.simulation); assert v.deterministic and v.invariant_ok and h.ok; loop=EngineeringLoop(human_gate_required=True); [loop.record(StageResult(s, True, ('ci',))) for s in EngineeringStage]; assert loop.ready_to_ship; r.scale_plan()"

      - name: Determinism/reproducibility gate
        run: python -c "from genesis.agents.agent import Agent; from genesis.core.checkpoint import build_checkpoint; from genesis.core.config import SimulationConfig; from genesis.core.simulation import Simulation; a=Simulation(config=SimulationConfig(seed=7)); b=Simulation(config=SimulationConfig(seed=7)); a.add_agent(Agent('a','A')); b.add_agent(Agent('a','A')); a.step(); b.step(); assert build_checkpoint(a).digest == build_checkpoint(b).digest; assert a.validate().ok"

      - name: Final scientific validation gate
        run: python -c "from genesis.core.finalization import run_final_validation; report=run_final_validation(steps=100, seed=2026); assert report.ok, report"

      - name: Experiment/scenario gate
        run: python -c "from genesis.core.experiments import Scenario, benchmark, calibrate, run_replicates, run_scenario, scale_plan; s=Scenario(name='ci-experiment', seed=2026, population=4, steps=5); a=run_scenario(s); b=run_scenario(s); assert a.ok and b.ok and a.checkpoint_digest == b.checkpoint_digest; assert all(r.ok for r in run_replicates(s, 2)); assert calibrate('population', [1,2,3], [1,3,2]).ok; assert sum(r.population for r in scale_plan(250001)) == 250001; assert all(r.ok for r in benchmark((0,2), steps=1).values())"

      - name: Reviewer gate
        run: python -c "from genesis.orchestration.engineering_loop import EngineeringLoop, EngineeringStage, StageResult; loop=EngineeringLoop(human_gate_required=True); [loop.record(StageResult(stage, True, ('preflight',))) for stage in EngineeringStage if stage != EngineeringStage.SHIP]; assert not loop.ready_to_ship; assert loop.pending() == (EngineeringStage.SHIP,)"

      - name: Final smoke gate
        run: python -c "from genesis.core.simulation import Simulation; Simulation().step()"
